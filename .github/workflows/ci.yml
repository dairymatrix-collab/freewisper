name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  quality:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 portaudio19-dev python3-tk libsecret-1-0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      # NOTE: on Linux, `pynput` (the hotkey extra) depends on `evdev`,
      # which ships only sdists and always builds a C extension. The
      # toolchain installed above covers it.
      - name: Install dependencies
        run: uv sync --frozen --all-extras --python ${{ matrix.python }}

      - name: Formatting check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term

      - name: Acceptance criteria — Phase 1
        run: uv run python scripts/verify_phase1.py

      - name: Acceptance criteria — Phase 2
        run: uv run python scripts/verify_phase2.py

      - name: Acceptance criteria — Phase 3
        run: uv run python scripts/verify_phase3.py

  python-versions:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 portaudio19-dev python3-tk libsecret-1-0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra audio --extra hotkey --extra tray --extra secrets --python ${{ matrix.python }}

      - name: Tests
        run: uv run pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      - name: Check the built wheel installs and runs
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/freewisper --version
          /tmp/check/bin/freewisper run --dry-run > /dev/null
          echo "wheel ok"
