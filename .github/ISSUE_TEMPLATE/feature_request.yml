name: Feature request
description: Suggest something Freewisper should be able to do
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: This is not already on the roadmap in `docs/BUILD-SPEC.md`.
        - label: This would work on more than one platform, or I have said which platform it targets.
